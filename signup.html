<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    main{
      align-items: center;
    }
    .sign-up {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  position: relative;
  background-color: #ffffff;
}

.sign-up .header {
  display: flex;
  width: 1440px;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 100px 32px 94px;
  position: relative;
  flex: 0 0 auto;
  background-color: #ffffff;
  border-top-style: none;
  border-right-style: none;
  border-bottom-width: 1px;
  border-bottom-style: solid;
  border-left-style: none;
  border-color: #d9d9d9;
}

.sign-up .text-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 91px;
  height: 32px;
  margin-top: -1.00px;
  font-family: "Leckerli One-Regular", Helvetica;
  font-weight: 400;
  color: #1e1e1e;
  font-size: 40px;
  letter-spacing: -1.20px;
  line-height: 48.0px;
  white-space: nowrap;
}

.sign-up .navigation-pill-list {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: flex-end;
  gap: 16px 16px;
  position: relative;
  flex: 1;
  flex-grow: 1;
}

.sign-up .navigation-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px;
  position: relative;
  flex: 0 0 auto;
  border-radius: 8px;
}

.sign-up .title {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  margin-top: -1.00px;
  font-family: var(--single-line-body-base-font-family);
  font-weight: var(--single-line-body-base-font-weight);
  color: #1e1e1e;
  font-size: var(--single-line-body-base-font-size);
  letter-spacing: var(--single-line-body-base-letter-spacing);
  line-height: var(--single-line-body-base-line-height);
  white-space: nowrap;
  font-style: var(--single-line-body-base-font-style);
}

.sign-up .page-product {
  display: flex;
  flex-direction: column;
  width: 1440px;
  align-items: flex-start;
  gap: 24px;
  padding: 64px 480px;
  position: relative;
  flex: 0 0 auto;
  background-color: #f5f5f5;
}

.sign-up .section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 64px;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
}

.sign-up .column {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 24px;
  position: relative;
  flex: 0 0 auto;
}

.sign-up .body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
  padding: 0px 100px;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
}

.sign-up .div {
  width: fit-content;
  font-family: "Inter-Bold", Helvetica;
  font-weight: 700;
  color: #1e1e1e;
  font-size: 48px;
  text-align: center;
  letter-spacing: -0.96px;
  line-height: 48px;
  white-space: nowrap;
  position: relative;
  margin-top: -1.00px;
}

.sign-up .form-register {
  display: flex;
  flex-direction: column;
  width: 480px;
  align-items: flex-start;
  gap: 24px;
  padding: 24px;
  position: relative;
  flex: 0 0 auto;
  background-color: #ffffff;
  border-radius: 8px;
  border: 1px solid;
  border-color: #d9d9d9;
}

.sign-up .input-field {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
}

.sign-up .label {
  position: relative;
  align-self: stretch;
  margin-top: -1.00px;
  font-family: var(--body-base-font-family);
  font-weight: var(--body-base-font-weight);
  color: #1e1e1e;
  font-size: var(--body-base-font-size);
  letter-spacing: var(--body-base-letter-spacing);
  line-height: var(--body-base-line-height);
  font-style: var(--body-base-font-style);
}

.sign-up .input {
  display: flex;
  min-width: 240px;
  align-items: center;
  padding: 12px 16px;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
  margin-bottom: -1.00px;
  margin-left: -1.00px;
  margin-right: -1.00px;
  background-color: #ffffff;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid;
  border-color: #d9d9d9;
}

.sign-up .value {
  position: relative;
  flex: 1;
  margin-top: -0.50px;
  font-family: var(--single-line-body-base-font-family);
  font-weight: var(--single-line-body-base-font-weight);
  color: #b3b3b3;
  font-size: var(--single-line-body-base-font-size);
  letter-spacing: var(--single-line-body-base-letter-spacing);
  line-height: var(--single-line-body-base-line-height);
  font-style: var(--single-line-body-base-font-style);
}

.sign-up .checkbox-field {
  display: flex;
  align-items: flex-start;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
}

.sign-up .checkbox-and-label {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  flex: 1;
  flex-grow: 1;
}

.sign-up .checkbox {
  display: flex;
  width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  background-color: #2c2c2c;
  border-radius: 4px;
  overflow: hidden;
}

.sign-up .check {
  position: relative;
  width: 16px;
  height: 16px;
}

.sign-up .text-wrapper-2 {
  flex: 1;
  font-family: var(--body-base-font-family);
  font-weight: var(--body-base-font-weight);
  color: #1e1e1e;
  font-size: var(--body-base-font-size);
  letter-spacing: var(--body-base-letter-spacing);
  line-height: var(--body-base-line-height);
  position: relative;
  margin-top: -1.00px;
  font-style: var(--body-base-font-style);
}

.sign-up .button-group {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
}

.sign-up .button {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  position: relative;
  flex: 1;
  flex-grow: 1;
  background-color: #2c2c2c;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid;
  border-color: #2c2c2c;
}

.sign-up .button-2 {
  position: relative;
  width: fit-content;
  margin-top: -1.00px;
  font-family: var(--single-line-body-base-font-family);
  font-weight: var(--single-line-body-base-font-weight);
  color: #f5f5f5;
  font-size: var(--single-line-body-base-font-size);
  letter-spacing: var(--single-line-body-base-letter-spacing);
  line-height: var(--single-line-body-base-line-height);
  white-space: nowrap;
  font-style: var(--single-line-body-base-font-style);
}

.sign-up .description-row {
  display: flex;
  width: 432px;
  align-items: center;
  justify-content: center;
  gap: 12px;
  position: relative;
  flex: 0 0 auto;
}

.sign-up .text-wrapper-3 {
  width: fit-content;
  font-family: var(--body-base-font-family);
  font-weight: var(--body-base-font-weight);
  color: #757575;
  font-size: var(--body-base-font-size);
  letter-spacing: var(--body-base-letter-spacing);
  line-height: var(--body-base-line-height);
  white-space: nowrap;
  position: relative;
  margin-top: -1.00px;
  font-style: var(--body-base-font-style);
}

.sign-up .footer {
  display: flex;
  width: 1440px;
  align-items: flex-start;
  gap: 16px;
  padding: 32px 32px 160px;
  position: relative;
  flex: 0 0 auto;
  background-color: #ffffff;
  border-top-width: 1px;
  border-top-style: solid;
  border-right-style: none;
  border-bottom-style: none;
  border-left-style: none;
  border-color: #d9d9d9;
}

.sign-up .title-2 {
  display: flex;
  flex-direction: column;
  width: 262px;
  align-items: flex-start;
  gap: 24px;
  position: relative;
}

.sign-up .icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex: 0 0 auto;
}

.sign-up .button-list {
  position: relative;
  flex: 0 0 auto;
}

  </style>
  <body>
    <div class="sign-up">
      <header class="header">
        <div class="text-wrapper">Club</div>
        <div class="navigation-pill-list">
          <div class="navigation-pill"><div class="title">Клуб</div></div>
          <div class="navigation-pill"><div class="title">Эвент</div></div>
        </div>
      </header>
      <div class="page-product">
        <div class="section">
          <div class="column">
            <div class="body"><div class="div">Бүртгүүлэх</div></div>
          </div>
        </div>
        <div class="form-register">
          <div class="input-field">
            <div class="label">Sisi mail</div>
            <div class="input"><div class="value">Утга</div></div>
          </div>
          <div class="input-field">
            <div class="label">Password</div>
            <div class="input"><div class="value">Утга</div></div>
          </div>
          <div class="checkbox-field">
            <div class="checkbox-and-label">
              <div class="checkbox"><img class="check" src="img/check.svg" /></div>
              <div class="text-wrapper-2">Нууц үг харах</div>
            </div>
          </div>
          <div class="button-group">
            <button class="button"><div class="button-2">Болсон</div></button>
          </div>
          <div class="description-row"><div class="text-wrapper-3">Нэвтрэх</div></div>
        </div>
      </div>
      <footer class="footer">
        <div class="title-2">
          <div class="icon"><div class="text-wrapper">Club</div></div>
          <img class="button-list" src="img/button-list.svg" />
        </div>
      </footer>
    </div>
  </body>
</html>
