<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUM.Clubs | User Profile</title>
    <link rel="stylesheet" href="style/enkhjin.css">
    <script type="module" src="./js/nc-eventcard.js"></script>
    <script type="module" src="./js/nc-clubrequestcard.js"></script>
    <script type="module" src="./js/nc-usercard.js"></script>
    <style>
        main{
            background-color: var(--color-gray);
        }
        .main{
            flex-direction:column;
            padding-top: 0px;
            padding-bottom: 64px;
        }
        .user_card{
            display:flex;
            flex-direction:row;
            gap:16px;
            align-items:flex-start;
            background-color: var(--color-white);
            padding: 28px 90px;
        }
        .info{
            display:flex;
            flex-direction:column;
            gap:0px;
            width: 70%;
        }
        .user_identity{
            display:flex;
            gap:8px;
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="main.html"><img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/></a>
        <nav>
            <a class="btn" href="clubs.html">Клуб</a>
            <a class="btn" href="events.hmtl">Эвент</a>
            <button class="btn1">Нэвтрэх</button>
            <button class="btn2">Бүртгүүлэх</button>
        </nav>
    </header>
    <div class="main">
        <nc-usercard></nc-usercard> 

        <div class="club_requests" id="clubs">
            <h2>Таны элсэх хүсэлт явуулсан клубүүд</h2>
            <div class="requests">
                <nc-clubrequestcard></nc-clubrequestcard>
                <nc-clubrequestcard></nc-clubrequestcard>
                <nc-clubrequestcard></nc-clubrequestcard>
            </div>
        </div> 

        <section class="events_section" id="events">
            <h2>Эвентүүд</h2>
            <section class="events">
                <nc-eventcard button1=""></nc-eventcard>
                <nc-eventcard></nc-eventcard>
                <nc-eventcard></nc-eventcard>
            </section>
        </section>

        <div class="club_requests">
            <h2>Хадгалсан</h2>
            <div class="requests">
                <nc-clubrequestcard desc="Мэдээллийн технологийн чиглэлээр үйл ажиллагаа явуулдаг бөгөөд оюутнуудын мэдлэгийг дээшлүүлэх, практик ур чадвар олгох, инновац бүтээхэд чиглэсэн үйл ажиллагаа явуулдаг"></nc-clubrequestcard>
                <nc-clubrequestcard desc="Мэдээллийн технологийн чиглэлээр үйл ажиллагаа явуулдаг бөгөөд оюутнуудын мэдлэгийг дээшлүүлэх, практик ур чадвар олгох, инновац бүтээхэд чиглэсэн үйл ажиллагаа явуулдаг"></nc-clubrequestcard>
                <nc-clubrequestcard desc="Мэдээллийн технологийн чиглэлээр үйл ажиллагаа явуулдаг бөгөөд оюутнуудын мэдлэгийг дээшлүүлэх, практик ур чадвар олгох, инновац бүтээхэд чиглэсэн үйл ажиллагаа явуулдаг"></nc-clubrequestcard>
            </div>
        </div> 

        <section class="events_section">
            <h2>Таны бүртгүүлсэн эвентүүд</h2>
            <section class="events">
                <nc-eventcard></nc-eventcard>
                <nc-eventcard></nc-eventcard>
                <nc-eventcard></nc-eventcard>
            </section>
        </section>
    </div>
    
    <footer>
        <img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/>
        <p>Холбогдох дугаар: +976 9999 9999</p>
    </footer>
</body>
</html>
