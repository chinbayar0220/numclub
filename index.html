<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUM.Clubs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
    <link rel="stylesheet" href="style/all.css">
    
</head>
<body>
    <header>
        <a class="logo" href="/" data-navigate="/"><img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/></a>
        <nav>
            <a class="btn" href="#/clubs">Клуб</a>
            <a class="btn" href="#/events">Эвент</a>
            <theme-toggle></theme-toggle>
            <button class="btn1" onclick="location.hash='#/login'">Нэвтрэх</button>
            <button class="btn2" onclick="location.hash='#/register'">Бүртгүүлэх</button>
        </nav>
    </header>

    <div id="app"></div>

    <footer>
        <img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/>
        <p>Холбогдох дугаар: +976 9999 9999</p>
    </footer>

    <script type="module" src="./js/nc-clubs-page.js"></script>
    <script type="module" src="./js/nc-user-profile-page.js"></script>
    <script type="module" src="./js/nc-main-page-new.js"></script>
    <script type="module" src="./js/nc-club-profile-page.js"></script>
    <script type="module" src="./js/nc-clubcard.js"></script>
    <script type="module" src="./js/nc-form.js"></script>
    <script type="module" src="./js/nc-eventcard.js"></script>
    <script type="module" src="./js/nc-clubrequestcard.js"></script>
    <script type="module" src="./js/nc-usercard.js"></script>
    <script type="module" src="./js/clb-event-card.js"></script>
    <script type="module" src="./js/nc-Cevent-card.js"></script>
    <script type="module" src="./js/nc-Cfeed-Back.js"></script>
    <script type="module" src="./js/theme-toggle.js"></script>
    <script type="module" src="./js/nc-login.js"></script>
    <script type="module" src="./js/nc-clubs-list.js"></script>
    <script type="module" src="./js/nc-reg-page.js"></script>
    <script type="module" src="./js/nc-club-filter.js"></script>
    
    <script type="module">
        try {
            console.log('index.html: importing router.js');
            await import('./js/router.js');
            console.log('index.html: router imported, Router =', window.Router);
            if (window.Router && typeof window.Router.init === 'function') {
                window.Router.init('#app');
                console.log('index.html: Router.init called');
            } else {
                console.error('index.html: Router is not available after import');
            }
        } catch (err) {
            console.error('index.html: error importing/initializing Router', err);
        }
    </script>
</body>
</html>
