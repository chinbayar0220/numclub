<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUM.Clubs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
    <link rel="stylesheet" href="style/enkhjin.css">
    <script type="module" src="./js/nc-clubcard.js"></script>
    <script type="module" src="./js/nc-form.js"></script>
    <style>
        /*     */
        html{
            margin:0;
            padding:0;
            font-family: sans-serif;
        }
        .main{
            flex-direction: row;
            padding: 28px 90px;
            gap: 5%;
            width: fit-content;
            
        }
        .sidebar{
            display:flex;
            flex-direction:column;
            padding: 8px 28px 28px 28px;
            gap: 8px;
            height: fit-content;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
            width: 20%;
        }
        .sidebar input[type="checkbox"]{
            margin: 8px 8px 8px 0px;
            cursor: pointer;
            accent-color: var(--color-default);
            width: 16px;
            height: 16px;
        }
        .sidebar input[type="checkbox"]:checked{
            accent-color: var(--color-default);
        }
        /* style label next to checkbox to highlight when checked */
        .sidebar input[type="checkbox"] + label{
            cursor: pointer;
            user-select: none;
        }
        .sidebar input[type="checkbox"]:checked + label{
            color: var(--color-default);
            font-weight: 500;
        }
        .content{
            display:flex;
            flex-direction:column;
            gap:28px;
            width: 75%;
        }
        form input[type="search"]{
            padding: 10px 16px;
            border: 1px solid #d3d3d3;
            border-radius: 20px;
            width: 320px;
            height: 40px;
            font-size: medium;
        }
        /* search area: keep input + radio buttons on one row */
        .search{ 
            display:flex;
            flex-direction: row;
            align-items:center;
            gap:16px;
            width:100%;
            height: fit-content;
        }
        .search > form{ /* the form that contains the search input and radios */
            display:flex;
            flex-direction: row;
            align-items:center;
            justify-content: space-between;
            gap:12px;
            width:100%;
        }
        .search input[type="search"]{
            max-width: 100%;
        }

        /* radio group styling: display radios like buttons */
        .radioff, .radio-group{ display:flex; gap:8px; align-items:center; margin-left:16px; }
        .radio{ display:flex; align-items:center; gap:8px; }

        /* visually hide native radio but keep it accessible */
        .radio input[type="radio"]{
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* visible button */
        .radio label{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            border:1px solid var(--color-secondary);
            border-radius:8px;
            cursor:pointer;
            background: var(--color-white);
            color: var(--color-secondary);
            user-select: none;
        }

        /* checked state: change background and text color */
        .radio input[type="radio"]:checked + label{
            background: var(--color-default);
            color: #ffffff;
            border-color: var(--color-default);
        }

        .radio label:hover{ background: var(--color-gray); }
        form input[type="radio"]{
            height: auto;
            padding: 8px 16px;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
        }

        .clubs{
            display: grid;
            grid-template-rows: auto auto auto;
            grid-template-columns: auto auto auto;
            gap: 28px;
            margin: auto;
        }
        .pagination{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:8px;
            padding:16px;
        }
        .pagination button{
            border: 1px solid var(--color-secondary);
            border-radius: 8px;
            background-color: var(--color-white);
            font-size: medium;
            color: var(--color-secondary);
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="main.html"><img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/></a>
        <nav>
            <a class="btn" href="clubs.html">Клуб</a>
            <a class="btn" href="events.hmtl">Эвент</a>
            <button class="btn1">Нэвтрэх</button>
            <button class="btn2">Бүртгүүлэх</button>
        </nav>
    </header>
    <div class="main"> 
        <div class="sidebar">
            <h3>Клубийн чиглэл</h3>
            <form class="chiglel">
                <h4>Чөлөөт</h4>
                <nc-form id="1" name="1" label="Сайн дурын"></nc-form>
                <nc-form id="2" name="2" label="Спорт"></nc-form>
                <nc-form id="3" name="3" label="Урлаг"></nc-form>
                <nc-form id="4" name="4" label="Чөлөөт"></nc-form>
                <nc-form id="5" name="5" label="Фото зураг"></nc-form>
                <nc-form id="6" name="6" label="Шинжлэх ухаан"></nc-form>
                <nc-form id="7" name="7" label="Мэдээллийн технологи"></nc-form>
                <nc-form id="8" name="8" label="Хэл судлал"></nc-form>
            </form>
            <form class="surguuli">
                <h4>Сургууль</h4>
                <nc-form id="1" name="business" label="БС"></nc-form>
                <nc-form id="2" name="its" label="ИТС"></nc-form>
                <nc-form id="3" name="mtes" label="МТЭС"></nc-form>
                <nc-form id="4" name="olonuls" label="УТСОУХНУС"></nc-form>
                <nc-form id="5" name="huuli" label="ХЗС"></nc-form>
                <nc-form id="6" name="shus" label="ШУС"></nc-form>
            </form>
            

        </div>
        <div class="content">
            <div class="search">
                <form action="#" method="get">
                    <input type="search" placeholder="Хайх" name="search">
                    <div class="radioff" role="radiogroup" aria-label="Sort order">
                        <div class="radio">
                            <input id="sort-az" type="radio" name="sortOrder" value="az">
                            <label for="sort-az">A-Я</label>
                        </div>
                        <div class="radio">
                            <input id="sort-za" type="radio" name="sortOrder" value="za">
                            <label for="sort-za">Я-А</label>
                        </div>
                    </div>
                </form>
            </div>
              
            <div class="clubs" id="clubs">        
                <nc-clubcard cname="Hackum students club"></nc-clubcard>
                <nc-clubcard cname="BSONK" desc="BSONK"></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard cname="Google developers club"></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
            </div>
            <div class="pagination">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
            </div>
        </div>
    </div>
    <footer>
        <img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/>
        <p>Холбогдох дугаар: +976 9999 9999</p>
    </footer>
</body>
</html>
