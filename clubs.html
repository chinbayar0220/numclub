<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUM.Clubs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
    <script type="module" src="./nc-clubcard.js"></script>
    <style>
        html{
            margin:0;
            padding:0;
            /* font-family: 'Inter', sans-serif; */
            font-family: 'Inter', sans-serif;
            font-size: medium;
            background-color: var(--color-white);
            --color-default: #2c2c2c;
            --color-secondary: #757575;
            --color-gray: #f5f5f5;
            --color-white: #ffffff;
        }
        .desc{
            font-size: medium;
            color: var(--color-secondary);
        }
        article h2{
            text-align: left;
        }
        fieldset{border-radius:8px;
                 border:1px solid grey;
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background-color: var(--color-white);
            width: flex;
            padding: 24px 90px;
            box-shadow: inset 0 -1px 0 #d3d3d3;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .page{
            font-weight: 500;
            color: var(--color-default);
            background-color: var(--color-gray);
            border: 1px solid var(--color-gray);
            border-radius: 8px;
            font-size: 16px;
            padding: 4px 8px;
            cursor: pointer;
            width: flex;
        }
        button {
            border: 1px solid var(--color-secondary);
            border-radius: 8px;
            background-color: #677AA8;
            font-size: 16px;
            color: white;
            padding: 8px 14px;
            cursor: pointer;
            width: flex;
        }
        header nav a {
            text-decoration: none;
            color: var(--color-default);
            font-weight: 500;
        }
        button.login{
            background-color: var(--color-white);
            color: var(--color-secondary);
        }
        button.signup{
            background-color: var(--color-default);
            color: var(--color-white);
        }
        header nav a:hover{
            color: var(--color-secondary);
        }
        button.login:hover{
            background-color: var(--color-gray);
        }
        button.signup:hover{
            background-color: #000000;
        }
        footer{
            display:block;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            gap:8px;
            background-color: var(--color-white);
            width: flex;
            height: 120px;
            padding: 28px 90px;
            box-shadow: inset 0 1px 0 #d3d3d3;
            gap: 16px;
        }   
        .main{
            display: flex;
            flex-direction: row;
            gap:64px;
            padding: 28px 90px;
            
        }
        .sidebar{
            display:flex;
            flex-direction:column;
            padding: 8px 28px 28px 28px;
            gap: 0px;
            height: fit-content;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
            width: 300px;
        }
        .sidebar input[type="checkbox"]{
            margin: 8px 8px 8px 0px;
        }
        .content{
            display:flex;
            flex-direction:column;
            gap:28px;
            width: 1200px;
        }
        form input[type="search"]{
            padding: 10px 16px;
            border: 1px solid #d3d3d3;
            border-radius: 20px;
            width: 320px;
            height: 40px;
            font-size: medium;
        }
        .clubs{
            display: grid;
            grid-template-rows: auto auto auto;
            grid-template-columns: auto auto auto;
            gap: 28px;
            margin: auto;
        }
        .club_card{
            display:flex;
            flex-direction:column;
            justify-content: flex-start;
            border: 1px solid #d3d3d3;
            padding: 24px;
            border-radius:8px;
            width: flex;
            height: 300px;
        }
        .club p{
                margin-top: 8px;
                font-size: medium;
                color: var(--color-secondary);
        }
        .buttons{
            display: grid;
            grid-template-columns: 36% 56%;
            justify-content: space-between;
            gap: 8%;
            margin-top: auto;
        }
        .clubs :hover{
            background-color: var(--color-gray);
        }
        .club_header{
            display:flex;
            align-items: center;
            gap: 16px;
            margin-top: 0px;
            height: 58px;
        }
        .search{
            display:flex;
            flex-direction:row;
            justify-content: space-between;
            align-items: center;
        }
        form input[type="radio"]{
            height: auto;
            padding: 8px 16px;
            border: 1px solid #d3d3d3;
            border-radius: 8px;
        }
        .pagination{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:8px;
            padding:16px;
        }
        .pagination button{
            border: 1px solid var(--color-secondary);
            border-radius: 8px;
            background-color: var(--color-white);
            font-size: medium;
            color: var(--color-secondary);
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
    
</head>
<body>
    <header>
        <a href="main.html"><img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/></a>
        <nav>
            <a class="page" href="clubs.html">Клуб</a>
            <a class="page" href="events.hmtl">Эвент</a>
            <button class="login">Нэвтрэх</button>
            <button class="signup">Бүртгүүлэх</button>
        </nav>
    </header>
    <div class="main"> 
        <div class="sidebar">
            <h4>Клубийн чиглэл</h4>
            <form>
                <h4>Чөлөөт</h4>
                <input type="checkbox" id="option1" name="option1" value="yes">
                <label for="option1">Сайн дурын</label>
                <br>
                <input type="checkbox" id="option2" name="option1" value="yes">
                <label for="option2">Спорт</label>
                <br>
                <input type="checkbox" id="option3" name="option1" value="yes">
                <label for="option3">Урлаг</label>
                <br>
                <input type="checkbox" id="option4" name="option1" value="yes">
                <label for="option4">Чөлөөт</label>
                <br>
                <input type="checkbox" id="option5" name="option1" value="yes">
                <label for="option5">Фото зураг</label>
                <br>
                <input type="checkbox" id="option6" name="option1" value="yes">
                <label for="option6">Шинжлэх ухаан</label>
                <br>
                <input type="checkbox" id="option7" name="option1" value="yes">
                <label for="option7">Мэдээллийн технологи</label>
                <br>
                <input type="checkbox" id="option8" name="option8" value="yes">
                <label for="option8">Хэл судлал</label>
            </form>
            <form>
                <h4>Мэргэжлийн клубүүд</h4>
                <input type="checkbox" id="business" name="option2" value="business">
                <label for="business">БС</label>
                <br>
                <input type="checkbox" id="its" name="option2" value="its">
                <label for="its">ИТС</label>
                <br>
                <input type="checkbox" id="mtes" name="option2" value="mtes">
                <label for="mtes">МТЭС</label>
                <br>
                <input type="checkbox" id="olonuls" name="option2" value="olonuls">
                <label for="olonuls">УТСОУХНУС</label>
                <br>
                <input type="checkbox" id="huuli" name="option2" value="huuli">
                <label for="huuli">ХЗС</label>
                <br>
                <input type="checkbox" id="shus" name="option2" value="shus">
                <label for="shus">ШУС</label>
                <label for="myRange"><h4>Гишүүний тоо</h4></label>
                <span>10</span>
                <input type="range" name="myRange" min="0" max="100" step="10" class="slider" id="myRange">
                <span>100</span>
            </form>
        </div>
        <div class="content">
            <div class="search">
                <form action="#" method="get">
                    <input type="search" placeholder="Хайх" name="search">
                    <form>
                        <input type="radio" placeholder="A-Ya" name="A-Ya">
                        <label for="A-Ya">A-Я</label>
                        <input type="radio" placeholder="Ya-A" name="Ya-A">
                        <label for="Ya-A">Я-А</label>
                    </form> 
                </form>
            </div>
              
            <div class="clubs" id="clubs">        
                <nc-clubcard cname="Hackum students club"></nc-clubcard>
                <nc-clubcard cname="BSONK" desc="BSONK"></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard cname="Google developers club"></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
                <nc-clubcard></nc-clubcard>
            </div>
            <div class="pagination">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
            </div>
        </div>
    </div>
    <footer>
        <img src="images/Club.svg" width="57.75" height="24" alt="NUM.Club Logo"/>
        <p>Холбогдох дугаар: +976 9999 9999</p>
    </footer>
</body>
</html>
