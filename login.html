<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх - NumClub</title>
    <link rel="stylesheet" href="style/all.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: var(--bg-primary, #fff);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--text-primary, #333);
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary, #333);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #2980b9;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .user-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .user-info.show {
            display: block;
        }

        .user-info h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .user-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .logout-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .nav-links {
            text-align: center;
            margin-top: 20px;
        }

        .nav-links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Нэвтрэх</h1>
            <p>Админ эрхээр нэвтрэх</p>
        </div>

        <div id="alertContainer"></div>

        <div id="loginForm">
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="email">И-мэйл хаяг</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="example@num.edu.mn"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Нууц үг</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Нэвтрэх
                </button>
            </form>
        </div>

        <div class="user-info" id="userInfo">
            <h3>✅ Амжилттай нэвтэрсэн</h3>
            <p><strong>Нэр:</strong> <span id="userName"></span></p>
            <p><strong>И-мэйл:</strong> <span id="userEmail"></span></p>
            <p><strong>Эрх:</strong> <span id="userRole"></span></p>
            <button class="logout-btn" onclick="logout()">Гарах</button>
        </div>

        <div class="nav-links">
            <a href="main.html">Нүүр хуудас</a>
            <a href="admin-create-club.html">Клуб үүсгэх</a>
        </div>
    </div>

    <script type="module">
        const API_BASE_URL = 'http://127.0.0.1:3000';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} show`;
            alertDiv.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        function displayUserInfo(user) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').classList.add('show');
            document.getElementById('userName').textContent = user.fullName || `${user.firstName} ${user.lastName}`;
            document.getElementById('userEmail').textContent = user.email;
            
            const roleNames = {
                'student': 'Оюутан',
                'club_admin': 'Клубын админ',
                'super_admin': 'Супер админ'
            };
            document.getElementById('userRole').textContent = roleNames[user.role] || user.role;
        }

        window.logout = function() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('userInfo').classList.remove('show');
            showAlert('Амжилттай гарлаа', 'success');
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            if (userId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/auth/check-admin?userId=${userId}`);
                    const result = await response.json();
                    
                    if (result.success && result.isAdmin) {
                        displayUserInfo({
                            fullName: localStorage.getItem('userName') || 'User',
                            email: localStorage.getItem('userEmail') || '',
                            role: localStorage.getItem('userRole') || 'student'
                        });
                    }
                } catch (error) {
                    console.error('Check session error:', error);
                }
            }
        });

        document.getElementById('loginFormElement')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Нэвтэрч байна...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Store user info in localStorage
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('userEmail', result.user.email);
                    localStorage.setItem('userRole', result.user.role);
                    localStorage.setItem('userName', result.user.fullName || `${result.user.firstName} ${result.user.lastName}`);

                    showAlert('✅ Амжилттай нэвтэрлээ!', 'success');
                    displayUserInfo(result.user);

                    // Redirect to admin page if admin
                    if (result.user.role === 'super_admin' || result.user.role === 'club_admin') {
                        setTimeout(() => {
                            window.location.href = 'admin-create-club.html';
                        }, 1500);
                    }
                } else {
                    showAlert(`❌ ${result.error}`, 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Нэвтрэх';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('❌ Серверт холбогдоход алдаа гарлаа', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Нэвтрэх';
            }
        });
    </script>
</body>
</html>
